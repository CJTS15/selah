[package]
name = "selah"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_10"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_24"] }
selah-core = { path = "selah-core" }
soup = { package = "soup3", version = "0.9" }

[workspace]
members = ["selah-core"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
